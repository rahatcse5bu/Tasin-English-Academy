name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Strip dev dependencies
        run: npm prune --omit=dev

      - name: Stage deploy artifacts
        run: |
          rm -rf ../deploy
          mkdir -p ../deploy/tmp
          cp -r dist ../deploy/dist
          cp -r node_modules ../deploy/node_modules
          cp package.json package-lock.json ../deploy/
          # Restart trigger for cPanel/Passenger after upload.
          date -u +"%Y-%m-%dT%H:%M:%SZ" > ../deploy/tmp/restart.txt

      - name: Normalize server dir (ensure trailing slash)
        id: dir
        run: |
          D="${{ secrets.FTP_BACKEND_DIR }}"
          [ "${D: -1}" = "/" ] || D="$D/"
          echo "path=$D" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP (delta sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./deploy/
          server-dir: ${{ steps.dir.outputs.path }}
          # NEVER overwrite the server's real .env (holds DB creds / JWT secret).
          exclude: |
            **/.env
            **/.env.*
