name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          # NEXT_PUBLIC_* values are baked in at build time.
          NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE }}
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          # Next.js standalone output already contains a minimal node_modules + server.js.
          # Static assets and public/ are NOT copied automatically — do it here.
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          # Touch a restart trigger so cPanel/Passenger reloads the app after the upload.
          mkdir -p .next/standalone/tmp
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .next/standalone/tmp/restart.txt

      - name: Normalize server dir (ensure trailing slash)
        id: dir
        run: |
          D="${{ secrets.FTP_FRONTEND_DIR }}"
          [ "${D: -1}" = "/" ] || D="$D/"
          echo "path=$D" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP (delta sync)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./frontend/.next/standalone/
          server-dir: ${{ steps.dir.outputs.path }}
